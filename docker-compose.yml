services:
  db:
    image: postgres:16

    environment:
      POSTGRES_USER: shaaz
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: tasks_db

    volumes:
      - tasks_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build: .

    depends_on:
      - db

    env_file:
      - .env

    ports:
      - "8000:8000"

volumes:
  tasks_postgres_data:


  
